name: dbt CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-postgres

      - name: Create Mock Profiles & Validate Syntax
        run: |
          mkdir -p ~/.dbt
          echo "banking_dbt_lakehouse:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: mock_user
                password: mock_password
                port: 5432
                dbname: mock_db
                schema: analytics" > ~/.dbt/profiles.yml
          dbt parse